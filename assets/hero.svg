<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Context Lens — Antigravity context analytics</title>
  <desc id="desc">Server-reported context and prompt cache composition. Illustrative example: 54,627 prompt tokens = 51,483 cache read + 3,144 new input.</desc>
  <rect width="1200" height="440" rx="12" fill="#191B1B"/>

  <!-- Quiet shared identity; product-specific specimens below. -->
  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, PingFang SC, Microsoft YaHei, sans-serif">
    <path d="M64 52H78 M64 59H84 M64 66H90" fill="none" stroke="#B8AA8D" stroke-width="2"/>
    <text x="108" y="65" font-size="16" font-weight="400" fill="#A5A8A3" letter-spacing="2.4">ANTIGRAVITY</text>
    <text x="1136" y="65" font-size="16" font-weight="400" fill="#A5A8A3" text-anchor="end" letter-spacing="1.6">CONTEXT &amp; TOKENS</text>
    <text x="60" y="193" font-size="84" font-weight="500" fill="#F1EFE9" letter-spacing="-3.8">Context Lens</text>
    <text x="64" y="253" font-size="30" font-weight="400" fill="#A5A8A3" letter-spacing="-0.5">看清每一轮的上下文。</text>
  </g>

  <path d="M696 127V328" stroke="#3A3D39"/>
  <g id="product-specimen" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="744" y="136" font-size="20" font-weight="400" fill="#A5A8A3" >当前上下文</text>
    <text x="744" y="208" font-size="64" font-weight="400" fill="#F1EFE9" letter-spacing="-2.6">54,627</text>
    <text x="1136" y="207" font-size="20" font-weight="400" fill="#A5A8A3" text-anchor="end">tokens</text>
    <!-- 51,483 cached + 3,144 new = 54,627 total; widths preserve that ratio. -->
    <rect x="744" y="233" width="369.439" height="8" fill="#B8AA8D"/>
    <rect x="1113.439" y="233" width="22.561" height="8" fill="#F1EFE9"/>
    <text x="744" y="281" font-size="20" font-weight="400" fill="#A5A8A3" >缓存读取</text>
    <text x="1136" y="281" font-size="20" font-weight="400" fill="#A5A8A3" text-anchor="end">新增输入</text>
    <text x="744" y="321" font-size="28" font-weight="400" fill="#B8AA8D" letter-spacing="-0.7">51,483</text>
    <text x="1136" y="321" font-size="28" font-weight="400" fill="#F1EFE9" text-anchor="end" letter-spacing="-0.7">3,144</text>
  </g>

  <path d="M64 369H1136" stroke="#3A3D39"/>
  <g id="metadata" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="405" font-size="16" font-weight="400" fill="#A5A8A3" letter-spacing="0.7">SERVER-REPORTED TOKENS</text>
    <text x="1136" y="405" font-size="16" font-weight="400" fill="#A5A8A3" text-anchor="end" letter-spacing="0.7">示例数据</text>
  </g>
</svg>

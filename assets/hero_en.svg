<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="auto">
  <title>Context Lens for Google Antigravity - Real-time Context &amp; Token Analytics</title>
  <desc>Native Sidebar Context Window &amp; Token Usage Analytics Extension for Google Antigravity IDE</desc>
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0A101F"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1A73E8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#1A73E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="20%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Accent Lines & Curves -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A73E8"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Area Gradient for Chart -->
    <linearGradient id="chartArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  </style>

  <!-- Container Rounded Background -->
  <rect x="0" y="0" width="1200" height="440" rx="20" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="440" rx="20" fill="url(#blueGlow)"/>
  <rect x="0" y="0" width="1200" height="440" rx="20" fill="url(#greenGlow)"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.12" stroke="#64748B" stroke-width="1" stroke-dasharray="2 4">
    <line x1="60" y1="0" x2="60" y2="440"/>
    <line x1="160" y1="0" x2="160" y2="440"/>
    <line x1="260" y1="0" x2="260" y2="440"/>
    <line x1="360" y1="0" x2="360" y2="440"/>
    <line x1="460" y1="0" x2="460" y2="440"/>
    <line x1="560" y1="0" x2="560" y2="440"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="380" x2="1200" y2="380"/>
  </g>

  <!-- Border Outline -->
  <rect x="1" y="1" width="1198" height="438" rx="19" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- ==================== LEFT HERO CONTENT ==================== -->
  <g transform="translate(68, 64)">
    <!-- Pill Badge -->
    <g>
      <rect x="0" y="0" width="226" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="15" r="5" fill="#34D399"/>
      <text x="30" y="20" class="sans" font-size="12" font-weight="600" fill="#E2E8F0" letter-spacing="0.5">GOOGLE ANTIGRAVITY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="88" class="sans" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
      Context Lens
    </text>

    <!-- Subtitle -->
    <text x="0" y="126" class="sans" font-size="18" font-weight="500" fill="#94A3B8" letter-spacing="-0.2">
      Native Sidebar Context Window &amp; Token Analytics
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="162" class="sans" font-size="14" fill="#64748B">
      <tspan x="0" dy="0">Server-grade physical log parser. Real-time Google Prompt Caching</tspan>
      <tspan x="0" dy="24">breakdown, per-turn growth curve, and one-click /compact optimization.</tspan>
    </text>

    <!-- Features Highlights Pills (Pure Vector, No Emojis) -->
    <g transform="translate(0, 226)">
      <!-- Pill 1: Native Aux Pane -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="144" height="34" rx="8" fill="#1E293B" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
        <circle cx="18" cy="17" r="4" fill="#38BDF8"/>
        <text x="30" y="21" class="sans" font-size="12" font-weight="600" fill="#38BDF8">Native Aux Pane</text>
      </g>
      <!-- Pill 2: Server-grade accuracy -->
      <g transform="translate(154, 0)">
        <rect x="0" y="0" width="144" height="34" rx="8" fill="#1E293B" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1"/>
        <circle cx="18" cy="17" r="4" fill="#34D399"/>
        <text x="30" y="21" class="sans" font-size="12" font-weight="600" fill="#34D399">Physical Precision</text>
      </g>
      <!-- Pill 3: Zero Dependency -->
      <g transform="translate(308, 0)">
        <rect x="0" y="0" width="144" height="34" rx="8" fill="#1E293B" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1"/>
        <circle cx="18" cy="17" r="4" fill="#A78BFA"/>
        <text x="30" y="21" class="sans" font-size="12" font-weight="600" fill="#A78BFA">Zero Dependency</text>
      </g>
    </g>

    <!-- Quick Command Prompt -->
    <g transform="translate(0, 278)">
      <rect x="0" y="0" width="452" height="36" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="23" class="mono" font-size="12" fill="#38BDF8">$</text>
      <text x="30" y="23" class="mono" font-size="12" fill="#E2E8F0">git clone ... ~/.gemini/config/plugins/context-lens</text>
    </g>
  </g>

  <!-- ==================== RIGHT UI MOCKUP BOARD ==================== -->
  <g transform="translate(610, 42)" filter="url(#softShadow)">
    <!-- Main Floating Card Window -->
    <rect x="0" y="0" width="520" height="356" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Top Header Bar -->
    <rect x="0" y="0" width="520" height="44" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <!-- Window Controls -->
    <circle cx="24" cy="22" r="5" fill="#EF4444"/>
    <circle cx="40" cy="22" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="22" r="5" fill="#10B981"/>
    <!-- Title -->
    <text x="76" y="27" class="sans" font-size="13" font-weight="600" fill="#E2E8F0">Context Lens · Active Session Monitor</text>
    <rect x="420" y="12" width="80" height="20" rx="10" fill="rgba(52, 211, 153, 0.15)"/>
    <circle cx="432" cy="22" r="3.5" fill="#34D399"/>
    <text x="442" y="26" class="sans" font-size="11" font-weight="600" fill="#34D399">Realtime</text>

    <!-- Inside Card: Metric Gauge -->
    <g transform="translate(24, 60)">
      <rect x="0" y="0" width="472" height="96" rx="10" fill="#0B1329" stroke="#1E293B" stroke-width="1"/>
      <!-- Gauge Main Text -->
      <text x="18" y="26" class="sans" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.5">CURRENT PROMPT CONTEXT</text>
      <text x="340" y="26" class="sans" font-size="11" font-weight="600" fill="#34D399">Healthy Zone (Optimal)</text>

      <text x="18" y="62" class="mono" font-size="30" font-weight="700" fill="#FFFFFF">54,627</text>
      <text x="146" y="60" class="sans" font-size="13" font-weight="500" fill="#94A3B8">Tokens</text>

      <rect x="382" y="42" width="72" height="24" rx="6" fill="rgba(56, 189, 248, 0.15)"/>
      <text x="396" y="59" class="mono" font-size="14" font-weight="700" fill="#38BDF8">5.2%</text>

      <!-- Progress Track -->
      <rect x="18" y="76" width="436" height="7" rx="3.5" fill="#1E293B"/>
      <rect x="18" y="76" width="140" height="7" rx="3.5" fill="url(#lineGrad)"/>
    </g>

    <!-- Inside Card: Composition 3-Columns -->
    <g transform="translate(24, 168)">
      <!-- Col 1: Cache Read -->
      <rect x="0" y="0" width="150" height="64" rx="8" fill="#0B1329" stroke="#1E293B" stroke-width="1"/>
      <circle cx="18" cy="19" r="3" fill="#34D399"/>
      <text x="26" y="22" class="sans" font-size="11" fill="#64748B">Cache Read</text>
      <text x="12" y="42" class="mono" font-size="16" font-weight="700" fill="#34D399">51,483</text>
      <text x="12" y="56" class="sans" font-size="10" font-weight="600" fill="#10B981">94.2% Hit Rate</text>

      <!-- Col 2: New Input -->
      <rect x="161" y="0" width="150" height="64" rx="8" fill="#0B1329" stroke="#1E293B" stroke-width="1"/>
      <circle cx="179" cy="19" r="3" fill="#38BDF8"/>
      <text x="187" y="22" class="sans" font-size="11" fill="#64748B">New Input</text>
      <text x="173" y="42" class="mono" font-size="16" font-weight="700" fill="#38BDF8">3,144</text>
      <text x="173" y="56" class="sans" font-size="10" fill="#64748B">Turn Incremental</text>

      <!-- Col 3: Output -->
      <rect x="322" y="0" width="150" height="64" rx="8" fill="#0B1329" stroke="#1E293B" stroke-width="1"/>
      <circle cx="340" cy="19" r="3" fill="#C084FC"/>
      <text x="348" y="22" class="sans" font-size="11" fill="#64748B">Model Output</text>
      <text x="334" y="42" class="mono" font-size="16" font-weight="700" fill="#C084FC">1,137</text>
      <text x="334" y="56" class="sans" font-size="10" fill="#64748B">Token Generation</text>
    </g>

    <!-- Inside Card: Mini Interactive Chart -->
    <g transform="translate(24, 244)">
      <rect x="0" y="0" width="472" height="92" rx="8" fill="#0B1329" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="20" class="sans" font-size="10" font-weight="600" fill="#64748B">CONTEXT GROWTH TIMELINE</text>
      <text x="390" y="20" class="mono" font-size="10" fill="#38BDF8">41 Turns</text>

      <!-- Chart Curve & Area -->
      <g transform="translate(14, 26)">
        <!-- Horizontal Grids -->
        <line x1="0" y1="52" x2="444" y2="52" stroke="#1E293B" stroke-width="1"/>
        <line x1="0" y1="26" x2="444" y2="26" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 3"/>

        <!-- Area Fill -->
        <path d="M 0 50 L 40 48 L 80 44 L 130 42 L 180 34 L 230 30 L 280 24 L 340 18 L 390 12 L 440 6 L 440 52 L 0 52 Z" fill="url(#chartArea)"/>
        <!-- Line Path -->
        <path d="M 0 50 L 40 48 L 80 44 L 130 42 L 180 34 L 230 30 L 280 24 L 340 18 L 390 12 L 440 6" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round"/>

        <!-- Highlighting Data Points -->
        <circle cx="180" cy="34" r="3" fill="#38BDF8"/>
        <circle cx="280" cy="24" r="3" fill="#38BDF8"/>
        <circle cx="440" cy="6" r="4.5" fill="#34D399" stroke="#0F172A" stroke-width="2"/>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Context Lens</title>
  <desc id="desc">Two open C contours form a nested context window. Warm white and muted gold on graphite.</desc>
  <rect width="64" height="64" rx="14" fill="#191B1B"/>
  <!-- The opening remains clear at 16px; two contours describe nested context. -->
  <path d="M44.374 19.626a17.5 17.5 0 1 0 0 24.748" fill="none" stroke="#F1EFE9" stroke-width="4.5"/>
  <path d="M38.364 25.636a9 9 0 1 0 0 12.728" fill="none" stroke="#B8AA8D" stroke-width="3.5"/>
</svg>
